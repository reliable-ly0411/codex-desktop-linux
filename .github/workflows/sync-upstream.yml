name: Sync and build Community deb
run-name: Community deb · ${{ github.event_name }} · ${{ inputs.architecture || 'amd64' }}

'on':
  schedule:
    # Asia/Shanghai: 02:23, 08:23, 14:23, 20:23.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: Sync upstream before building / 先同步上游
        type: boolean
        default: true
      force_rebuild:
        description: Rebuild even if a downloadable package exists / 强制重建
        type: boolean
        default: false
      architecture:
        description: Package architecture / 安装包架构
        type: choice
        options: [amd64, arm64, both]
        default: amd64
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-upstream.yml
      - scripts/ci/community-build*
      - scripts/ci/sync-community-fork.sh

permissions:
  contents: read

concurrency:
  group: community-sync-and-build-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'reliable-ly0411/codex-desktop-linux' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.sync.outputs.source_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Sync main without force and record its exact commit
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SYNC_UPSTREAM: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_upstream }}
        run: bash scripts/ci/sync-community-fork.sh

  build:
    needs: sync
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'both' && '["amd64","arm64"]' || inputs.architecture == 'arm64' && '["arm64"]' || '["amd64"]') }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ needs.sync.outputs.source_sha }}
      BUILD_ARCH: ${{ matrix.architecture }}
      FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
      CODEX_LINUX_FEATURES_CONFIG: ${{ github.workspace }}/linux-features/features.example.json
      PACKAGE_WITH_UPDATER: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.sync.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Prepare runner-local build state
        run: echo "BUILD_STATE_DIR=$RUNNER_TEMP/community-build-$BUILD_ARCH" >> "$GITHUB_ENV"
      - name: Verify signed metadata and check existing successful artifacts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/community-build.js plan
      - uses: dtolnay/rust-toolchain@56f84321dbccf38fb67ce29ab63e4754056677e0
        if: steps.plan.outputs.build == 'true'
        with:
          toolchain: stable
          components: clippy
      - name: Install build dependencies
        if: steps.plan.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev gnupg patchelf ripgrep
      - name: Check updater and build orchestration
        if: steps.plan.outputs.build == 'true'
        run: |
          cargo test --locked -p codex-update-manager
          cargo clippy --locked -p codex-update-manager --all-targets -- -D warnings
          node --test scripts/ci/community-build.test.js scripts/lib/upstream-linux-package.test.js linux-features/appshots/test.js
          bash -n scripts/ci/sync-community-fork.sh scripts/ci/community-build-deb.sh
      - name: Build and verify installable deb with automatic cache cleanup
        if: steps.plan.outputs.build == 'true'
        run: bash scripts/ci/community-build-deb.sh
      - name: Upload verified deb, checksums and provenance
        if: steps.plan.outputs.build == 'true'
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: community-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Download link
        if: steps.plan.outputs.build == 'true'
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: printf '\n[Download verified package / 下载安装包](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
